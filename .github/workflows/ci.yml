name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci
      - run: npm run check
        env:
          PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder"
      - run: npm test
